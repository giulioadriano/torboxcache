<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torbox Cache Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bg-color: #0f0f13;
            --surface-color: #1a1a20;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #f3f4f6;
            margin: 0;
            overflow-x: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid var(--accent-color);
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased">

    <!-- Navbar fixa (z-40 para ficar abaixo dos modais) -->
    <nav class="bg-[#1a1a20] border-b border-gray-800 p-4 sticky top-0 z-40 shadow-lg">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.scrollTo(0,0)">
                <div class="bg-indigo-500 p-2 rounded-lg text-white shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight">Torbox <span class="text-indigo-400 font-medium">Cache Explorer</span></h1>
            </div>
            <button onclick="openSettings()" class="text-gray-400 hover:text-white bg-gray-800 hover:bg-gray-700 p-2 rounded-full transition shadow-sm" title="Configurações">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </nav>

    <main class="container mx-auto p-4 py-8 max-w-7xl">
        <!-- Barra de Pesquisa -->
        <div class="max-w-3xl mx-auto mb-10">
            <form id="searchForm" class="relative flex" onsubmit="event.preventDefault(); performSearch();">
                <input type="text" id="searchInput" placeholder="Pesquise um filme ou série..." 
                       class="w-full bg-[#1a1a20] border border-gray-700 rounded-xl pl-5 pr-14 py-4 text-white placeholder-gray-500 outline-none focus:border-indigo-500 shadow-sm transition">
                <button type="submit" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-indigo-400 hover:text-indigo-300 transition cursor-pointer">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </button>
            </form>
        </div>

        <!-- Estados Principais -->
        <div id="mainLoader" class="flex flex-col items-center py-20 hidden">
            <div class="loader mb-4"></div>
            <p class="text-gray-400">Buscando em filmes e séries...</p>
        </div>

        <!-- Grid de Resultados -->
        <div id="resultsInfo" class="mb-4 text-gray-300 font-medium text-lg hidden"></div>
        <div id="postersGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5"></div>
    </main>

    <!-- Modal de Configurações (z-50) -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-[#1a1a20] border border-gray-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <button onclick="closeSettings()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="text-xl font-bold text-white mb-4">Configurações</h2>
            <label class="block text-sm text-gray-400 mb-2">Chave de API do Torbox</label>
            <input type="password" id="apiKeyInput" placeholder="Bearer eyJhb..." class="w-full bg-black border border-gray-700 rounded-lg px-4 py-3 text-white outline-none focus:border-indigo-500 mb-4">
            <button onclick="saveSettings()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg py-3 transition">Salvar Chave</button>
        </div>
    </div>

    <!-- Modal de Detalhes / Streams (z-50) -->
    <div id="detailsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-[#15151a] border border-gray-700 rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl relative overflow-hidden">
            
            <div class="p-6 border-b border-gray-800 bg-[#1f1f26] relative">
                <button onclick="closeDetails()" class="absolute top-6 right-6 text-gray-400 hover:text-white bg-gray-800 p-2 rounded-full">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <h3 id="modalTitle" class="text-2xl font-bold text-white mb-1 pr-10">Título</h3>
                <div class="flex items-center gap-3">
                    <span id="modalBadge" class="px-2 py-0.5 rounded text-xs font-bold text-white uppercase tracking-wider"></span>
                    <span id="modalYear" class="text-sm text-gray-400 font-medium"></span>
                </div>
            </div>

            <div class="p-6 overflow-y-auto flex-1">
                <!-- Status do Loader -->
                <div id="streamLoader" class="flex flex-col items-center justify-center py-10">
                    <div class="loader mb-4"></div>
                    <p id="streamLoaderText" class="text-gray-300 font-medium text-center">Iniciando busca...</p>
                </div>
                
                <!-- Mensagem de Erro/Vazio -->
                <div id="streamMessage" class="hidden text-center py-10">
                    <p id="streamMessageText" class="text-gray-400"></p>
                </div>

                <!-- Lista de Streams em Cache -->
                <div id="streamList" class="hidden flex flex-col gap-3"></div>
            </div>
        </div>
    </div>

    <script>
        // ESTADO GLOBAL
        let apiKey = localStorage.getItem('torbox_api_key_v3') || '';
        
        // ELEMENTOS DOM
        const settingsModal = document.getElementById('settingsModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const searchInput = document.getElementById('searchInput');
        const mainLoader = document.getElementById('mainLoader');
        const resultsInfo = document.getElementById('resultsInfo');
        const postersGrid = document.getElementById('postersGrid');
        
        const detailsModal = document.getElementById('detailsModal');
        const streamLoader = document.getElementById('streamLoader');
        const streamLoaderText = document.getElementById('streamLoaderText');
        const streamMessage = document.getElementById('streamMessage');
        const streamMessageText = document.getElementById('streamMessageText');
        const streamList = document.getElementById('streamList');

        // INICIALIZAÇÃO
        window.addEventListener('DOMContentLoaded', () => {
            if (!apiKey) openSettings();
        });

        // FUNÇÕES DE CONFIGURAÇÃO
        function openSettings() {
            apiKeyInput.value = apiKey;
            settingsModal.classList.remove('hidden');
        }

        function closeSettings() {
            settingsModal.classList.add('hidden');
        }

        function saveSettings() {
            const val = apiKeyInput.value.trim();
            if (val) {
                apiKey = val;
                localStorage.setItem('torbox_api_key_v3', apiKey);
                closeSettings();
            }
        }

        // FUNÇÕES DE BUSCA (CINEMETA COMBINADO)
        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            postersGrid.innerHTML = '';
            resultsInfo.classList.add('hidden');
            mainLoader.classList.remove('hidden');

            try {
                // Dispara busca para filmes e séries simultaneamente
                const [resMovies, resSeries] = await Promise.all([
                    fetch(`https://v3-cinemeta.strem.io/catalog/movie/top/search=${encodeURIComponent(query)}.json`).catch(() => null),
                    fetch(`https://v3-cinemeta.strem.io/catalog/series/top/search=${encodeURIComponent(query)}.json`).catch(() => null)
                ]);

                let combined = [];

                if (resMovies && resMovies.ok) {
                    const data = await resMovies.json();
                    if (data.metas) combined.push(...data.metas.map(m => ({ ...m, mediaType: 'movie' })));
                }

                if (resSeries && resSeries.ok) {
                    const data = await resSeries.json();
                    if (data.metas) combined.push(...data.metas.map(m => ({ ...m, mediaType: 'series' })));
                }

                if (combined.length === 0) {
                    resultsInfo.textContent = "Nenhum resultado encontrado.";
                    resultsInfo.classList.remove('hidden');
                    return;
                }

                resultsInfo.textContent = `${combined.length} resultados encontrados`;
                resultsInfo.classList.remove('hidden');

                combined.forEach(item => {
                    const isMovie = item.mediaType === 'movie';
                    const poster = item.poster || `https://placehold.co/400x600/1a1a20/666666?text=${encodeURIComponent(item.name)}`;
                    
                    const card = document.createElement('div');
                    card.className = "bg-[#1a1a20] rounded-xl overflow-hidden cursor-pointer border border-gray-800 hover:border-indigo-500 transition-all hover:-translate-y-1 shadow-lg group";
                    card.innerHTML = `
                        <div class="aspect-[2/3] w-full bg-black relative">
                            <img src="${poster}" alt="${item.name}" loading="lazy" class="w-full h-full object-cover">
                            <div class="absolute top-2 right-2 px-2 py-1 rounded text-[10px] font-bold text-white shadow ${isMovie ? 'bg-indigo-600' : 'bg-purple-600'}">
                                ${isMovie ? 'FILME' : 'SÉRIE'}
                            </div>
                        </div>
                        <div class="p-3">
                            <h4 class="font-bold text-sm text-gray-100 line-clamp-1">${item.name}</h4>
                            <span class="text-xs text-gray-400">${item.releaseInfo || item.year || ''}</span>
                        </div>
                    `;
                    card.onclick = () => openDetails(item);
                    postersGrid.appendChild(card);
                });

            } catch (err) {
                resultsInfo.textContent = "Erro ao buscar dados.";
                resultsInfo.classList.remove('hidden');
            } finally {
                mainLoader.classList.add('hidden');
            }
        }

        // FUNÇÕES DO MODAL DE DETALHES E PROXY
        function openDetails(item) {
            if (!apiKey) {
                alert("Configure a chave da API primeiro.");
                return openSettings();
            }

            document.getElementById('modalTitle').textContent = item.name;
            document.getElementById('modalYear').textContent = item.releaseInfo || item.year || '';
            const badge = document.getElementById('modalBadge');
            badge.textContent = item.mediaType === 'movie' ? 'FILME' : 'SÉRIE';
            badge.className = `px-2 py-0.5 rounded text-xs font-bold text-white uppercase tracking-wider ${item.mediaType === 'movie' ? 'bg-indigo-600' : 'bg-purple-600'}`;

            streamList.innerHTML = '';
            streamList.classList.add('hidden');
            streamMessage.classList.add('hidden');
            streamLoader.classList.remove('hidden');
            detailsModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            fetchStreams(item);
        }

        function closeDetails() {
            detailsModal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        async function fetchStreams(item) {
            try {
                let id = item.imdb_id || item.id;
                if (!id) throw new Error("ID não encontrado.");
                
                // Para séries, busca a Temporada 1, Episódio 1 por padrão
                if (item.mediaType === 'series') id += ':1:1';

                streamLoaderText.textContent = "Buscando fontes no Torrentio...";

                const res = await fetch(`https://torrentio.strem.fun/stream/${item.mediaType}/${id}.json`);
                if (!res.ok) throw new Error("Falha na resposta do Torrentio.");
                
                const data = await res.json();
                let streams = data.streams || [];

                // 6. Filtro Anti-Gravação (CAM, HDCAM, TS, Telesync)
                const blockedRegex = /\b(cam|hdcam|ts|telesync)\b/i;
                streams = streams.filter(s => {
                    const textToTest = `${s.name} ${s.title}`.toLowerCase();
                    return !blockedRegex.test(textToTest);
                });

                if (streams.length === 0) throw new Error("Nenhuma fonte de alta qualidade encontrada.");

                // Extrair InfoHashes
                const hashMap = new Map();
                streams.forEach(s => {
                    const hash = s.infoHash || (s.url && s.url.match(/btih:([a-zA-Z0-9]+)/)?.[1]);
                    if (hash) hashMap.set(hash.toLowerCase(), s);
                });

                const hashes = Array.from(hashMap.keys());
                if (hashes.length === 0) throw new Error("Nenhum Hash válido encontrado nas fontes.");

                streamLoaderText.textContent = "Verificando cache no Torbox via Proxy...";
                await checkTorboxCache(hashes, hashMap);

            } catch (err) {
                streamLoader.classList.add('hidden');
                streamMessageText.innerHTML = `<span class="text-red-400 font-semibold">Erro:</span> ${err.message}`;
                streamMessage.classList.remove('hidden');
            }
        }

        async function checkTorboxCache(hashes, hashMap) {
            try {
                // 7. Verificação de Cache (Torbox + Proxy Cloudflare)
                // Chunk hashes para não estourar URL longa
                const chunkSize = 60;
                let cachedHashes = new Set();
                
                for (let i = 0; i < hashes.length; i += chunkSize) {
                    const chunk = hashes.slice(i, i + chunkSize);
                    const targetUrl = `https://api.torbox.app/v1/api/torrents/checkcached?hash=${chunk.join(',')}&format=list`;
                    const proxyUrl = `https://nameless-rice-7971.giulioadriano.workers.dev/?url=${encodeURIComponent(targetUrl)}`;

                    const res = await fetch(proxyUrl, {
                        method: 'GET',
                        headers: { 'Authorization': `Bearer ${apiKey}` }
                    });

                    if (!res.ok) {
                        if (res.status === 401 || res.status === 403) throw new Error("Chave API do Torbox inválida.");
                        throw new Error(`Proxy retornou HTTP ${res.status}`);
                    }

                    const json = await res.json();
                    
                    if (json.success && json.data) {
                        if (Array.isArray(json.data)) {
                            json.data.forEach(h => cachedHashes.add((typeof h === 'string' ? h : h.hash).toLowerCase()));
                        } else if (typeof json.data === 'object') {
                            Object.entries(json.data).forEach(([hash, isCached]) => {
                                if (isCached) cachedHashes.add(hash.toLowerCase());
                            });
                        }
                    }
                }

                // 8. Exibição dos Resultados em Cache
                const finalStreams = [];
                cachedHashes.forEach(hash => {
                    if (hashMap.has(hash)) finalStreams.push(hashMap.get(hash));
                });

                streamLoader.classList.add('hidden');

                if (finalStreams.length === 0) {
                    streamMessageText.textContent = "Nenhum stream em cache encontrado no momento.";
                    streamMessage.classList.remove('hidden');
                    return;
                }

                renderStreams(finalStreams);

            } catch (err) {
                streamLoader.classList.add('hidden');
                streamMessageText.innerHTML = `<span class="text-red-400 font-semibold">Erro de Proxy/Torbox:</span> ${err.message}`;
                streamMessage.classList.remove('hidden');
            }
        }

        function renderStreams(streams) {
            streamList.innerHTML = '';
            
            streams.forEach(s => {
                const rawName = s.name || 'Torrent';
                const titleStr = s.title || '';
                const parts = titleStr.split('\n');
                const cleanTitle = parts[0] || 'Título Desconhecido';
                const sizeInfo = parts.find(p => p.includes('GB') || p.includes('MB')) || '';

                const card = document.createElement('div');
                card.className = "bg-[#1a1a20] border border-emerald-900/50 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-emerald-500/50 transition";
                
                card.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1 flex-wrap">
                            <span class="bg-gray-800 text-gray-200 border border-gray-700 px-2 py-0.5 rounded text-xs font-bold">
                                ${rawName.replace('Torrentio\n', '').trim()}
                            </span>
                            ${sizeInfo ? `<span class="text-gray-400 text-xs font-medium border border-gray-800 px-2 py-0.5 rounded">${sizeInfo.replace('👤', '').trim()}</span>` : ''}
                        </div>
                        <h4 class="text-sm text-gray-200 line-clamp-2" title="${cleanTitle}">${cleanTitle}</h4>
                    </div>
                    <div class="shrink-0 bg-emerald-500/10 text-emerald-400 px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-emerald-500/20">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        <span class="text-xs font-bold uppercase tracking-wide">Cache Instântaneo</span>
                    </div>
                `;
                streamList.appendChild(card);
            });

            streamList.classList.remove('hidden');
        }
    </script>
</body>
</html>
